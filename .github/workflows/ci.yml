name: SentryLens CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION:   "20"

jobs:
  backend-test:
    name: Backend — pytest (54 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install aiosqlite

      - name: Syntax check all Python files
        working-directory: backend
        run: |
          python -c "
          import ast, os, sys
          errors = []
          for root, dirs, files in os.walk('app'):
              dirs[:] = [d for d in dirs if d != '__pycache__']
              for f in files:
                  if not f.endswith('.py'): continue
                  path = os.path.join(root, f)
                  try: ast.parse(open(path).read())
                  except SyntaxError as e: errors.append(f'{path}: {e}')
          if errors:
              [print('SYNTAX ERROR:', e) for e in errors]; sys.exit(1)
          print(f'Syntax OK: {sum(1 for *_, f in (os.walk(\"app\")) for ff in f if ff.endswith(\".py\"))} files')
          "

      - name: Run full test suite
        working-directory: backend
        env:
          APP_ENV:              test
          DATABASE_URL:         sqlite+aiosqlite:///:memory:
          DATABASE_URL_SYNC:    sqlite:///./test_tmp.db
          SECRET_KEY:           ci-test-secret-key-at-least-32-chars
          TWILIO_ACCOUNT_SID:   ""
          TWILIO_AUTH_TOKEN:    ""
          MODEL_PATH:           /nonexistent/model.pt
          SNAPSHOT_DIR:         /tmp/sl_ci_snap
          REDIS_URL:            redis://localhost:6379/15
          CELERY_BROKER_URL:    redis://localhost:6379/15
          CELERY_RESULT_BACKEND: redis://localhost:6379/15
          DASHBOARD_URL:        http://localhost:3000
        run: pytest tests/ -v --tb=short

  frontend-typecheck:
    name: Frontend — TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm install

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Lint
        working-directory: frontend
        run: npm run lint || true   # warn only, don't block on lint

  docker-build:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-typecheck]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend
        run: docker build ./backend -t sentrylens-backend:${{ github.sha }} --no-cache

      - name: Build frontend
        run: docker build ./frontend -t sentrylens-frontend:${{ github.sha }} --no-cache

version: "3.9"

# ═══════════════════════════════════════════════════════════════════
# SentryLens — Production Docker Compose
# ═══════════════════════════════════════════════════════════════════
#
# Differences from docker-compose.yml (dev):
#   - No source code bind-mounts (built images only)
#   - Uvicorn runs with multiple workers (--workers 4)
#   - PostgreSQL has explicit resource limits
#   - Nginx terminates HTTP (add SSL cert mounts for HTTPS)
#   - Restart policies are always (not unless-stopped)
#   - No --reload flag on uvicorn
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#   docker-compose -f docker-compose.prod.yml logs -f backend
# ═══════════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentrylens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-sentrylens}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentrylens}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M
    networks:
      - internal

  backend:
    image: sentrylens-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
      --proxy-headers
      --forwarded-allow-ips='*'
    env_file: .env
    volumes:
      - model_data:/app/models:ro
      - snapshot_data:/app/snapshots
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G   # YOLOv8 model is ~50MB but inference needs headroom
      # Uncomment for GPU:
      # reservations:
      #   devices:
      #     - driver: nvidia
      #       count: 1
      #       capabilities: [gpu]
    networks:
      - internal

  celery_worker:
    image: sentrylens-backend:latest
    restart: always
    command: celery -A app.workers.tasks worker --loglevel=warning --concurrency=2 -Q default
    env_file: .env
    volumes:
      - model_data:/app/models:ro
      - snapshot_data:/app/snapshots
    depends_on:
      - redis
      - postgres
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - internal

  celery_beat:
    image: sentrylens-backend:latest
    restart: always
    command: celery -A app.workers.tasks beat --loglevel=warning --scheduler celery.beat.PersistentScheduler
    env_file: .env
    volumes:
      - celerybeat_data:/app/celerybeat
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - internal

  frontend:
    image: sentrylens-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost}
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - internal

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      # For HTTPS, uncomment and add SSL cert mounts:
      # - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # For SSL:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - internal
      - external

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  model_data:
    driver: local
    # In production, pre-populate this with your trained model:
    # docker volume create sentrylens_model_data
    # docker run --rm -v sentrylens_model_data:/data -v $(pwd)/ml/output:/src alpine cp /src/sentrylens_best.pt /data/
  snapshot_data:
    driver: local
  celerybeat_data:
    driver: local

networks:
  internal:
    driver: bridge
    internal: true   # Backend services not directly reachable from outside
  external:
    driver: bridge   # Only nginx is on the external network

# SentryLens — Nginx Reverse Proxy
# WebSocket upgrade, long timeouts for live feeds, no public /snapshots mount

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=120r/m;

upstream backend  { server backend:8000;  keepalive 32; }
upstream frontend { server frontend:3000; keepalive 16; }

server {
    listen 80;
    server_name _;

    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection      "1; mode=block" always;
    client_max_body_size 20M;
    proxy_connect_timeout 10s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        proxy_pass http://backend/health;
        access_log off;
    }

    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://backend;
    }

    # WebSocket streams (cameras + alerts) — long read timeout, no buffering
    # NOTE: /api/v1/snapshots is NOT here — it goes through regular /api/ route with auth
    location ~ ^/api/v1/streams/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout  86400s;   # WebSocket connections stay open for hours
        proxy_send_timeout  86400s;
        proxy_buffering     off;
    }

    # All other API routes (including /api/v1/snapshots — authenticated)
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # NOTE: /snapshots/ static mount REMOVED — BUG-36 fix.
    # Snapshot images now served at /api/v1/snapshots/{path} with authentication.

    # Next.js static assets
    location /_next/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Frontend — everything else
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        return 502 '{"error":"Service temporarily unavailable"}';
        add_header Content-Type application/json;
    }
}

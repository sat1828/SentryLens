[pytest]
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show slow tests
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: marks integration tests requiring a running DB
    unit: marks pure unit tests with no external dependencies
